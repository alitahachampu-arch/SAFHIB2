<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFHIB — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1f3c;
    --navy-mid: #162d52;
    --navy-light: #1e3d6e;
    --white: #f5f7fa;
    --off-white: #d0d8e8;
    --accent: #c8a84b;
    --accent-light: #e6c97a;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* Pitch lines background */
  .pitch-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .pitch-bg svg {
    width: 100%;
    height: 100%;
    opacity: 0.05;
  }

  /* Subtle radial glow */
  .glow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(30,61,110,0.6) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-align: center;
    padding: 2rem;
  }

  /* Logo */
  .logo-wrap {
    width: 160px;
    height: 160px;
    margin-bottom: 2rem;
    animation: fadeDown 1s ease both;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }

  /* Brand name */
  .brand-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 14vw, 140px);
    letter-spacing: 0.12em;
    line-height: 0.9;
    color: var(--white);
    animation: fadeUp 1s ease 0.2s both;
  }

  /* Divider line with badge */
  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: min(500px, 90vw);
    margin: 1.8rem 0;
    animation: fadeUp 1s ease 0.4s both;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
  }

  .divider-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    opacity: 0.9;
  }

  /* Coming soon text */
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(13px, 2.5vw, 16px);
    font-weight: 300;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--off-white);
    margin-bottom: 0.5rem;
    animation: fadeUp 1s ease 0.5s both;
  }

  .coming-soon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 8vw, 72px);
    letter-spacing: 0.18em;
    color: var(--accent);
    line-height: 1;
    animation: fadeUp 1s ease 0.6s both;
  }

  .subtitle {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(14px, 2vw, 17px);
    font-weight: 300;
    color: var(--off-white);
    letter-spacing: 0.08em;
    margin-top: 1.2rem;
    max-width: 380px;
    line-height: 1.7;
    animation: fadeUp 1s ease 0.75s both;
  }

  /* Notify form */
  .notify-form {
    display: flex;
    gap: 0;
    margin-top: 2.5rem;
    width: min(420px, 90vw);
    animation: fadeUp 1s ease 0.9s both;
  }

  .notify-form input {
    flex: 1;
    padding: 0 1.2rem;
    height: 48px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-right: none;
    border-radius: 4px 0 0 4px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.2s;
  }

  .notify-form input::placeholder { color: rgba(255,255,255,0.3); }
  .notify-form input:focus { border-color: var(--accent); }

  .notify-form button {
    padding: 0 1.5rem;
    height: 48px;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0 4px 4px 0;
    color: var(--navy);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .notify-form button:hover { background: var(--accent-light); }

  .thanks-msg {
    display: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-top: 2.5rem;
    animation: fadeUp 0.5s ease both;
  }

  /* Social links */
  .socials {
    display: flex;
    gap: 1.5rem;
    margin-top: 3rem;
    animation: fadeUp 1s ease 1.1s both;
  }

  .socials a {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .socials a:hover {
    border-color: var(--accent);
    background: rgba(200,168,75,0.08);
  }

  .socials svg {
    width: 18px;
    height: 18px;
    fill: var(--off-white);
  }

  /* Footer */
  .footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    z-index: 1;
  }

  /* Keyframes */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div class="glow"></div>

  <h1 class="brand-name">SAFHIB</h1>

  <div class="divider">
    <div class="divider-line"></div>

    <svg class="divider-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="var(--accent)">
      <circle cx="50" cy="50" r="48" fill="none" stroke="var(--accent)" stroke-width="3"/>

      <polygon points="72,70 58,76 46,70 46,58 62,56 72,62" fill="var(--accent)" opacity="0.85"/>

      <polygon points="18,50 28,36 38,40 38,52 26,60" fill="var(--accent)" opacity="0.8"/>
    </svg>
    <div class="divider-line"></div>

  <p class="tagline">The Game. The Kit. The Culture.</p>
  <h2 class="coming-soon">COMING SOON</h2>

  <div class="notify-form" id="notify-form">
    <input type="email" id="email-input" placeholder="Enter your email" autocomplete="off">
    <button onclick="handleNotify()">Notify Me</button>

  <div class="socials">

<p class="footer">© 2025 Safhib &nbsp;·&nbsp; All rights reserved</p>

<script>
function handleNotify() {
  const input = document.getElementById('email-input');
  const form = document.getElementById('notify-form');
  const thanks = document.getElementById('thanks-msg');
  if (!input.value || !input.value.includes('@')) {
    input.style.borderColor = '#e24b4a';
    setTimeout(() => input.style.borderColor = '', 1200);
    return;
  }
  form.style.display = 'none';
  thanks.style.display = 'block';
}

document.getElementById('email-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleNotify();
});
</script>

</body>
</html>
