<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SAFHIB — Print Your Style · Launching Soon</title>
<meta name="description" content="SAFHIB — Premium printed shirts & print-on-demand. Print Your Style, Wear Your Identity. Launching soon." />
<link rel="icon" id="favicon" href="logo.png" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:#0f1e3d; --gold:#c9a96e; --card-bg:rgba(255,255,255,0.55);
    --card-border:rgba(15,30,61,0.08); --shadow-soft:0 20px 60px rgba(15,30,61,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',sans-serif;color:var(--navy)}
  body{display:flex;flex-direction:column;align-items:stretch;background:linear-gradient(135deg,#f6f2ea 0%,#ede5d4 50%,#f6f2ea 100%);background-size:400% 400%;min-height:100vh}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;position:relative;z-index:1}
  .logo-wrap{width:180px;height:180px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft);margin-bottom:28px;padding:14px;position:relative}
  .logo-wrap img{width:100%;height:100%;object-fit:contain}
  .brand{font-family:'Cormorant Garamond',serif;font-size:clamp(3.2rem,9vw,5.5rem);letter-spacing:.36em;color:var(--navy);margin-bottom:8px;padding-left:.36em}
  .tagline{font-size:.95rem;letter-spacing:.28em;text-transform:uppercase;color:var(--navy);opacity:.85;margin-bottom:32px}
  .coming-soon{font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,3vw,2rem);font-style:italic;color:var(--navy);margin-bottom:28px}
  .countdown{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:36px}
  .count-box{background:var(--card-bg);backdrop-filter:blur(10px);border:1px solid var(--card-border);border-radius:12px;padding:14px 20px;min-width:78px}
  .num{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--navy);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .label{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);opacity:.7;margin-top:6px}
  .notify{width:100%;max-width:480px;margin-bottom:26px}
  .notify form{display:flex;background:var(--card-bg);border:1px solid var(--card-border);border-radius:999px;overflow:hidden;box-shadow:var(--shadow-soft)}
  .notify input{flex:1;border:none;padding:14px 18px;font-size:.95rem;background:transparent;color:var(--navy);outline:none}
  .notify button{border:none;background:var(--navy);color:#f6f2ea;padding:0 22px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}
  .message{font-size:.88rem;margin-top:12px;min-height:1.2em;opacity:0;transition:opacity .2s}
  .message.show{opacity:1}
  .socials{display:flex;gap:12px;margin-top:8px}
  footer{text-align:center;padding:18px;font-size:.78rem;color:var(--navy);opacity:.7}
  @media(max-width:480px){ .logo-wrap{width:140px;height:140px} .brand{font-size:4rem} .count-box{padding:10px 14px} .num{font-size:1.6rem} .notify form{flex-direction:column;border-radius:14px} .notify button{padding:12px} }
  /* visually-hidden for accessibility labels */
  .sr-only{position:absolute!important;clip:rect(1px,1px,1px,1px);padding:0;border:0;height:1px;width:1px;overflow:hidden;white-space:nowrap}
</style>
</head>
<body>

<main>
  <div class="logo-wrap" aria-hidden="false">
    <!-- Logo element: script below will set the correct src -->
    <img id="siteLogo" src="logo.png" alt="SAFHIB logo" />
  </div>

  <h1 class="brand">SAFHIB</h1>
  <p class="tagline">Print Your Style · Wear Your Identity</p>
  <h2 class="coming-soon">Something Beautiful is Coming Soon</h2>

  <div class="countdown" id="countdown" aria-live="polite">
    <div class="count-box"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="count-box"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="count-box"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="count-box"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <div class="notify">
    <p>Be the first to know when we launch.</p>
    <form id="notifyForm" novalidate>
      <label for="email" class="sr-only">Email address</label>
      <input id="email" type="email" name="email" placeholder="Enter your email" required autocomplete="email" />
      <button type="submit">Notify Me</button>
    </form>
    <div id="formMsg" class="message" role="status" aria-live="polite"></div>
  </div>

  <div class="socials" aria-hidden="false">
    <a href="https://www.instagram.com/safhib_official/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">IG</a>
    <a href="mailto:safhib.official@gmail.com" aria-label="Email">✉</a>
  </div>
</main>

<footer>© <span id="year"></span> SAFHIB · All rights reserved</footer>

<script>
/* ---------- Logo auto-detect (tries common filenames & folders) ---------- */
(function () {
  const img = document.getElementById('siteLogo');
  const favicon = document.getElementById('favicon');
  if (!img) return;

  // Candidate paths to try (order matters). Add any custom paths you use.
  const candidates = [
    'logo.png', 'Logo.png', 'logo.PNG', 'Logo.PNG',
    'logo.jpg', 'logo.jpeg', 'Logo.jpg', 'Logo.jpeg',
    'images/logo.png', 'images/Logo.png',
    'assets/logo.png', 'assets/logo.jpg',
    './logo.png', './logo.jpg'
  ];

  // Inline SVG fallback (data URL)
  const placeholderSVG = encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
      '<rect width="100%" height="100%" fill="%23ffffff"/>' +
      '<circle cx="100" cy="72" r="48" fill="%230f1e3d"/>' +
      '<text x="100" y="136" font-family="Cormorant Garamond, serif" font-size="24" fill="%23c9a96e" text-anchor="middle">SAFHIB</text>' +
    '</svg>'
  );
  const placeholder = 'data:image/svg+xml;utf8,' + placeholderSVG;

  let idx = 0;

  function tryNext() {
    if (idx >= candidates.length) {
      // nothing found -> show placeholder
      setLogo(placeholder, true);
      return;
    }
    const path = candidates[idx++];
    // attempt to load via Image() to avoid CORS/HEAD issues
    const tester = new Image();
    // cache-buster to avoid stale cached 404 on GH Pages
    tester.src = path + '?v=' + (new Date()).getTime();
    tester.onload = function () {
      setLogo(path);
    };
    tester.onerror = function () {
      tryNext();
    };
    // safety: if neither onload nor onerror fire after 3s, move on
    setTimeout(function () {
      if (!tester.complete) tryNext();
    }, 3000);
  }

  function setLogo(src, isPlaceholder) {
    img.src = src;
    // update favicon if it's a real file (not placeholder)
    if (!isPlaceholder && favicon) {
      favicon.href = src;
    }
    img.alt = isPlaceholder ? 'SAFHIB' : 'SAFHIB logo';
    img.setAttribute('data-logo-src', src);
    // add a gentle visual indication if placeholder used
    if (isPlaceholder) img.style.background = '#ffffff';
  }

  // If the current src already loads, do nothing; otherwise start trying
  const initial = img.getAttribute('src') || '';
  const initialTester = new Image();
  initialTester.onload = function () { /* ok */ };
  initialTester.onerror = function () { tryNext(); };
  initialTester.src = initial + '?v=' + (new Date()).getTime();

  // If there was no initial src, start immediately
  if (!initial) tryNext();
})();

/* ---------- Simple countdown (example target) ---------- */
(function () {
  const launch = new Date('2025-12-31T00:00:00Z').getTime();
  const dEl = document.getElementById('days');
  const hEl = document.getElementById('hours');
  const mEl = document.getElementById('minutes');
  const sEl = document.getElementById('seconds');
  function tick() {
    const now = Date.now();
    let diff = Math.max(0, launch - now);
    const d = Math.floor(diff / (1000*60*60*24));
    diff -= d * (1000*60*60*24);
    const h = Math.floor(diff / (1000*60*60));
    diff -= h * (1000*60*60);
    const m = Math.floor(diff / (1000*60));
    const s = Math.floor((diff / 1000) % 60);
    if (dEl) dEl.textContent = String(d).padStart(2,'0');
    if (hEl) hEl.textContent = String(h).padStart(2,'0');
    if (mEl) mEl.textContent = String(m).padStart(2,'0');
    if (sEl) sEl.textContent = String(s).padStart(2,'0');
    if (launch - Date.now() <= 0) clearInterval(timer);
  }
  tick();
  const timer = setInterval(tick, 1000);
})();

/* ---------- Simple form behavior using localStorage ---------- */
(function () {
  const form = document.getElementById('notifyForm') || document.getElementById('notifyForm');
  const email = document.getElementById('email');
  const msg = document.getElementById('formMsg');
  if (!form || !email || !msg) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const val = (email.value || '').trim();
    if (!val || !val.includes('@')) {
      msg.textContent = 'Please enter a valid email.';
      msg.classList.add('show');
      msg.style.color = '#c0392b';
      return;
    }
    // store locally (replace with real endpoint later)
    const list = JSON.parse(localStorage.getItem('safhib_waitlist') || '[]');
    if (!list.includes(val)) {
      list.push(val);
      localStorage.setItem('safhib_waitlist', JSON.stringify(list));
    }
    email.value = '';
    msg.textContent = 'Thanks — we will notify you at launch.';
    msg.classList.add('show');
    msg.style.color = '';
  });
})();

/* ---------- Year in footer ---------- */
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
