<style>
  :root {
    --navy: #0f1e3d;
    --navy-light: #1c2e5a;
    --cream: #f6f2ea;
    --cream-deep: #ede5d4;
    --gold: #c9a96e;
    --gold-light: #d9bd87;
    --text: #0f1e3d;
    --bg-grad-1: #f6f2ea;
    --bg-grad-2: #ede5d4;
    --card-bg: rgba(255, 255, 255, 0.55);
    --card-border: rgba(15, 30, 61, 0.08);
    --shadow-soft: 0 20px 60px rgba(15, 30, 61, 0.12);
    --shadow-strong: 0 30px 80px rgba(15, 30, 61, 0.2);
  }

  [data-theme="dark"] {
    --navy: #f6f2ea;
    --navy-light: #ede5d4;
    --cream: #0f1e3d;
    --cream-deep: #0a1530;
    --gold: #d9bd87;
    --text: #f6f2ea;
    --bg-grad-1: #0a1530;
    --bg-grad-2: #1c2e5a;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.1);
    --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-1) 100%);
    background-size: 400% 400%;
    animation: gradientShift 22s ease infinite;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: color 0.4s ease;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Decorative blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
    animation: blobMove 20s ease-in-out infinite;
  }
  .blob.one { width: 450px; height: 450px; background: var(--navy); top: -120px; left: -120px; }
  .blob.two { width: 380px; height: 380px; background: var(--gold); bottom: -120px; right: -120px; animation-delay: -10s; }

  @keyframes blobMove {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -30px) scale(1.1); }
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    color: var(--navy);
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s, background 0.3s;
  }
  .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }
  .theme-toggle svg { width: 20px; height: 20px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 40px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* Logo */
  .logo-wrap {
    width: 180px;
    height: 180px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft);
    margin-bottom: 32px;
    animation: float 6s ease-in-out infinite;
    padding: 14px;
    position: relative;
  }
  .logo-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), transparent, var(--gold));
    z-index: -1;
    opacity: 0.5;
    animation: rotate 12s linear infinite;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  /* Brand */
  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.5rem, 10vw, 6.5rem);
    color: var(--navy);
    letter-spacing: 0.4em;
    font-weight: 700;
    margin-bottom: 12px;
    padding-left: 0.4em;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeUp 1s ease 0.2s both;
  }

  .tagline {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: var(--navy);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 48px;
    opacity: 0.8;
    animation: fadeUp 1s ease 0.4s both;
  }
  .tagline::before, .tagline::after {
    content: "—";
    margin: 0 12px;
    color: var(--gold);
  }

  .coming-soon {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--navy);
    font-style: italic;
    margin-bottom: 36px;
    font-weight: 500;
    animation: fadeUp 1s ease 0.6s both;
  }
  .coming-soon::after {
    content: "";
    display: block;
    width: 70px;
    height: 1px;
    background: var(--gold);
    margin: 16px auto 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: 16px;
    margin-bottom: 48px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 1s ease 0.8s both;
  }
  .count-box {
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 26px;
    min-width: 90px;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .count-box:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-soft);
  }
  .count-box .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count-box .label {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy);
    opacity: 0.7;
    margin-top: 8px;
  }

  /* Notify form */
  .notify {
    width: 100%;
    max-width: 480px;
    margin-bottom: 36px;
    animation: fadeUp 1s ease 1s both;
  }
  .notify p {
    font-size: 0.92rem;
    color: var(--navy);
    margin-bottom: 16px;
    opacity: 0.85;
  }
  .notify form {
    display: flex;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 50px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    transition: box-shadow 0.3s;
  }
  .notify form:focus-within {
    box-shadow: var(--shadow-strong);
  }
  .notify input {
    flex: 1;
    border: none;
    outline: none;
    padding: 16px 24px;
    font-family: inherit;
    font-size: 0.92rem;
    background: transparent;
    color: var(--navy);
  }
  .notify input::placeholder { color: var(--navy); opacity: 0.5; }
  .notify button {
    border: none;
    background: var(--navy);
    color: var(--cream);
    padding: 0 32px;
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  .notify button:hover { background: var(--gold); }
  .notify button:active { transform: scale(0.97); }
  .notify .message {
    font-size: 0.85rem;
    margin-top: 14px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s, transform 0.3s;
    min-height: 1.2em;
  }
  .notify .message.show { opacity: 1; transform: translateY(0); }
  .notify .message.success { color: var(--navy); }
  .notify .message.error   { color: #c0392b; }

  /* Socials */
  .socials {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    animation: fadeUp 1s ease 1.2s both;
  }
  .socials a {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    text-decoration: none;
  }
  .socials a:hover {
    transform: translateY(-5px);
    background: var(--gold);
    box-shadow: 0 10px 20px rgba(201, 169, 110, 0.4);
  }
  .socials svg { width: 20px; height: 20px; }

  footer {
    text-align: center;
    padding: 24px 20px;
    font-size: 0.72rem;
    color: var(--navy);
    opacity: 0.6;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .logo-wrap { width: 140px; height: 140px; }
    .count-box { padding: 14px 18px; min-width: 70px; }
    .count-box .num { font-size: 1.7rem; }
    .notify form { flex-direction: column; border-radius: 16px; }
    .notify button { padding: 16px; }
    .theme-toggle { top: 16px; right: 16px; }
  }

  /* Utility: visually-hidden (used for accessibility) */
  .sr-only {
    position: absolute;
    left: -9999px;
    top: auto;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>
</head>

<script>
/* -------------------------
   Small helper: get element by id safely
   ------------------------- */
const $id = (id) => document.getElementById(id);

/* =========================
   1) Logo auto-detect & fallback
   ========================= */
(function () {
  const img = $id('siteLogo');
  if (!img) return;

  // Candidate PNG (and common) paths — adjust if you know a different folder
  const candidatePaths = [
    'logo.png',
    'Logo.png',
    'logo.PNG',
    'Logo.PNG',
    './logo.png',
    'images/logo.png',
    'images/Logo.png',
    'assets/logo.png',
    'img/logo.png'
  ];

  // Inline SVG placeholder (data URI) — used as last resort
  const placeholderSVG = encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">' +
      '<rect width="100%" height="100%" fill="%23ffffff"/>' +
      '<circle cx="100" cy="80" r="48" fill="%230f1e3d" />' +
      '<text x="100" y="128" font-family="Cormorant Garamond, serif" font-size="28" fill="%23c9a96e" text-anchor="middle">SAFHIB</text>' +
    '</svg>'
  );
  const placeholderDataUrl = 'data:image/svg+xml;utf8,' + placeholderSVG;

  // Check if a URL exists (HEAD first)
  async function exists(url) {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      return res && res.ok;
    } catch (e) {
      // fallback to GET (may be blocked by CORS, but raw.githubusercontent supports HEAD)
      try {
        const res2 = await fetch(url, { method: 'GET' });
        return res2 && res2.ok;
      } catch (e2) {
        return false;
      }
    }
  }

  // Try current src first
  (async () => {
    const cur = img.getAttribute('src') || '';
    try {
      if (cur && await exists(cur)) {
        return; // current src works
      }
    } catch (e) { /* ignore */ }

    // Try candidate paths
    for (const path of candidatePaths) {
      try {
        if (await exists(path)) {
          img.src = path;
          return;
        }
      } catch (e) { /* ignore */ }
    }

    // Try GitHub raw URL option (optional): uncomment & set your repo if you want automatic raw usage
    // const rawUrl = 'https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/logo.png';
    // if (await exists(rawUrl)) { img.src = rawUrl; return; }

    // Nothing found — show placeholder
    img.src = placeholderDataUrl;

    // If browser fails to load any chosen src later, fallback to placeholder
    img.onerror = () => { if (img.src !== placeholderDataUrl) img.src = placeholderDataUrl; };
  })();
})();

/* =========================
   2) Countdown
   ========================= */
(function () {
  // set your launch date here
  const launchDate = new Date("2025-12-31T00:00:00").getTime();

  function pad(n) { return String(n).padStart(2, "0"); }
  function updateCountdown() {
    const diff = launchDate - Date.now();
    const cd = $id('countdown');
    if (diff <= 0) {
      if (cd) cd.innerHTML = '<div class="count-box" style="padding:24px 36px"><div class="num">LIVE</div><div class="label">We Are Live</div></div>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff / 3600000) % 24);
    const m = Math.floor((diff / 60000) % 60);
    const s = Math.floor((diff / 1000) % 60);

    if ($id('days'))    $id('days').textContent    = pad(d);
    if ($id('hours'))   $id('hours').textContent   = pad(h);
    if ($id('minutes')) $id('minutes').textContent = pad(m);
    if ($id('seconds')) $id('seconds').textContent = pad(s);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();

/* =========================
   3) Notify form (localStorage)
   ========================= */
(function () {
  const form = $id('notifyForm');
  const messageEl = $id('message');
  const emailInput = $id('email');
  if (!form || !messageEl || !emailInput) return;

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message show ${type}`;
    if (type === 'success') setTimeout(() => messageEl.classList.remove('show'), 5000);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showMessage('Please enter a valid email address.', 'error');
      return;
    }
    const subs = JSON.parse(localStorage.getItem('safhib_subs') || '[]');
    if (subs.includes(email)) {
      showMessage("You're already on the list ✓", 'success');
      return;
    }
    subs.push(email);
    localStorage.setItem('safhib_subs', JSON.stringify(subs));
    showMessage("✓ Thank you! We'll keep you posted.", 'success');
    form.reset();
  });
})();

/* =========================
   4) Theme toggle (respects system pref)
   ========================= */
(function () {
  const themeToggle = $id('themeToggle');
  const themeIcon = $id('themeIcon');
  if (!themeToggle || !themeIcon) return;

  const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const sunIcon  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeIcon.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
    localStorage.setItem('safhib_theme', theme);
  }

  const savedTheme = localStorage.getItem('safhib_theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  applyTheme(savedTheme);
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
})();

/* =========================
   Footer year
   ========================= */
(function(){ const y = new Date().getFullYear(); if ($id('year')) $id('year').textContent = y; })();
</script>
